<div class="flex flex-col w-full min-h-screen bg-grey">
    <app-header [section]="section"/>
    <div class="grid grid-cols-8 mt-9 mb-4 items-center overflow-auto">
        <p class="col-span-4 ml-4">{{session.name}}</p>
        <div class="flex items-center justify-center col-span-2 h-10">
            <input class="w-3/4 h-full rounded-tl-xl rounded-bl-xl border border-zinc-400 border-opacity-80 pl-5" type="text" [(ngModel)]="StuName" placeholder="Trouver un élève">
            <button class="w-1/4 h-full bg-blueButton rounded-tr-xl rounded-br-xl text-white">Search</button>
        </div>
        <button 
            class="flex items-center justify-center col-span-2 w-4/5 h-full bg-bgTable rounded-xl text-black ml-6"
            [routerLink]="['/session', session.id, 'lookup','modifier']"
            >Modifier le niveau d'un élève</button>
    </div>
    <div class="flex flex-col mt-5 m-3">
        <div class="flex flex-row justify-center items-center bg-bgHeaderTable border border-borderTable rounded-t-lg" >
            <p class="flex w-full py-2 mx-3 border-r border-borderTable">Studients</p>
            <p class="flex w-full py-2 ">Avancement</p>
        </div>
        <div *ngFor = "let avancement of avancements" class="flex flex-row justify-center bg-bgTable border-x border-b border-borderTable" >
            <p class="flex w-full py-2 mx-3 border-r border-borderTable">{{avancement.name}}</p>
            <p class="flex w-full py-2 ">{{getPercentage(avancement.niveau)}}</p>
        </div>
    </div>
</div>
