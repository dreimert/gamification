
<!-- <div class="w-[1920px] h-[1080px] relative bg-gray-200 border border-neutral-500"> -->
<div class="min-h-screen flex-col flex relative bg-gray-200 border border-neutral-500">
    <app-header [section]="section"></app-header>
    <div class="items-start justify-start min-h-screen flex ">
        <div *ngFor="let session of sessions"class="w-[207px] h-[279px] left-[50px] top-[54px] ml-10 relative max-w-full">
            <div class="w-[206px] h-[235px] left-[1px] top-[4px] absolute bg-zinc-300"></div>
            <div class="w-[206px] h-[132px] left-[1px] top-0 absolute bg-white "></div>
            <div class="w-[51px] h-[15px] left-[147px] top-[7px] absolute">
                <div class="w-[51px] h-3.5 left-0 top-[1px] absolute bg-green-500 rounded-[10px]" 
                    [class.bg-green-500]="session.state == 'en cours' "
                    [class.bg-red-400]="session.state == 'Terminée' "
                ></div>
                <div class="w-[51px] h-[15px] left-0 top-0 absolute text-center text-white text-[10px] font-medium font-['Inter'] leading-[15px]">{{session.state}}</div>
            </div>
            <img class="object-contain w-[196px] h-[122px] left-[5.3px] top-[5px] absolute" [src]="session.imgpath" />
            <span class="w-[207px] h-[78px] left-0 top-[140px] absolute text-center text-black font-medium font-['Inter'] leading-9 text-2xl"
                [ngStyle]="{ 'font-size': calculateFontSize(session.Name.length) }">{{session.Name}}</span>
            <div class="w-[92px] h-[34.09px] left-[59px] top-[185px] absolute">
                <div class="w-[92px] h-[34.09px] left-0 top-0 absolute bg-blue-600 rounded-[15px]"></div>
                <button (click)="openDialog(session)" class="w-[69.62px] h-[28.95px] left-[11.44px] top-[2.57px] absolute text-center text-white text-xs font-medium font-['Inter'] leading-[18px]">
                    {{ session.state == 'en cours' ? 'Rejoindre' : 'Consulter'}}
                </button>
            </div>
        </div>
    </div>
</div>
