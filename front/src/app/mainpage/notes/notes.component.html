<div class="flex flex-col w-full min-h-screen bg-grey">
    <app-header [section]="section"></app-header>
    <div class="flex w-1/3 h-10 mt-9 ml-3 ">
        <input
            class="w-full h-full rounded-lg border border-zinc-600 border-opacity-80 pl-5"
            type="text"
            [(ngModel)]="sessionSearch"
            (ngModelChange)="searchSession()"
            placeholder="Trouver une session" />
    </div>

    <div class="flex flex-col mt-5 m-3">
        <div class="flex flex-row justify-center items-center bg-bgHeaderTable border border-borderTable rounded-t-lg mr-4">
            <p class="flex w-full py-2 mr-3 ml-3 border-r border-borderTable">TP</p>
            <p class="flex w-full py-2 mr-3 border-r border-borderTable">Note</p>
            <p class="flex w-full py-2 mr-3 border-r border-borderTable">Moyenne</p>
            <p class="flex w-full py-2">Coefficient</p>
        </div>
        <div class="overflow-y-scroll">
            <div
                *ngFor="let note of filteredNote; let index = index"
                class="flex flex-row justify-center bg-bgTable border-x border-b border-borderTable"
                [class.rounded-b-lg]="index === notes_stu.length - 1">
                <p class="flex w-full py-2 mx-3 border-r border-borderTable">
                    {{ note.name }}
                </p>
                <p class="flex w-full py-2 mr-3 border-r border-borderTable">
                    {{ note.note }}
                </p>
                <p class="flex w-full py-2 mr-3 border-r border-borderTable">
                    {{ note.moyenne }}
                </p>
                <p class="flex w-full py-2">{{ note.coefficient }}</p>
            </div>
        </div>
    </div>
</div>
