<div class="h-screen flex-col flex bg-grey">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 ml-5 overflow-y-auto">
        <div *ngFor="let session of selectSession(Header)" class="flex flex-col mt-10 mx-4 bg-grey-dark rounded-b-lg">
            <div class="container h-full mx-auto relative border-b justify-center flex">
                <img class="object-contain h-full w-full top-0" [src]="session.imgpath" />
                <div class=" absolute top-0 right-0 mt-1 mr-1 h-fit rounded-lg"
                    [class.bg-greenPellet]="isGreenPellet(session)"
                    [class.bg-redPellet]="isRedPellet(session)">
                    <p class=" my-1 mx-1 text-center text-white text-xs font-medium font-inter">
                        {{session.state}}
                    </p>
                </div>
            </div>
            <div class=" flex flex-col justify-center w-full mt-5">
                <p class=" mb-5 mx-1 text-center text-xl font-medium font-inter" [ngStyle]="{ 'font-size': calculateFontSize(session.Name.length) }">
                    {{session.Name}}
                </p>
                <button (click)="openDialog(session)" class="w-fit mx-auto mt-auto mb-3 justify-center bg-blueButton rounded-lg text-white">
                    <p class="cursor-pointer text-base my-3 mx-3 leading-3 text-white font-inter">
                        {{ session.state == 'En cours' ? 'Rejoindre' : 'Consulter'}}
                    </p>
                </button>
            </div>
        </div>
    </div>
</div>
