<main class="flex w-full h-full justify-start items-start">
    <div class="flex" *ngIf="router.url.split('/')[1] !== 'tp'; else elseBlock">
        <div class="w-1/5">
            <app-side-bar></app-side-bar>
        </div>
        <div class="w-4/5">
            <router-outlet></router-outlet>
        </div>
    </div>
    <ng-template #elseBlock>
        <router-outlet></router-outlet>
    </ng-template>
</main>
