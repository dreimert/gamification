<div class="bg-black h-4/5 w-4/5 rounded-t-lg absolute top-1/2 left-1/2  transform -translate-x-1/2 -translate-y-1/2 ">
    <div class="flex flex-row justify-center items-center bg-bgHeaderTable rounded-t-lg">
        <p class="flex w-full py-2 mx-3 ">TP Scrapping</p>
    </div>
  
    <div *ngIf="lvl === 0" >
        <div *ngFor="let sentence of sentences" class="animate-typing overflow-hidden whitespace-break-spaces cursor-none flexmt mx-1 text-white font-light">
            <ngx-typed-js  [typeSpeed]="1" [strings]="[sentence]"lvl>
                <span class="typing" ></span>
                <input class="bg-black border-none outline-none font-medium" type="text" [(ngModel)]="passcode"  (keyup.enter)="getEnteredPasscode(0)" autofocus>
            </ngx-typed-js>
        </div>
        <p *ngIf="codeEntered && !codeCorrect" class="text-red-400 mx-1 font-light">&emsp;&emsp;Veuillez taper 'start'.</p>
        <p *ngIf="codeEntered && codeCorrect" class="text-green-600 mx-1 font-light">&emsp;&emsp;Très bien</p>
    </div>
    <div *ngIf="lvl === 1" >
        <div *ngFor="let sentence of sentences" class="animate-typing overflow-hidden whitespace-break-spaces flexmt mx-1 text-white font-light">
            <ngx-typed-js  [typeSpeed]="1" [strings]="[sentence]" (keyup.enter)="changeLevel">
                <span class="typing" ></span>
                <input class="relative bg-black border-none outline-none" type="text" [(ngModel)]="passcode"  (keyup.enter)="getEnteredPasscode(1)">
            </ngx-typed-js>
        </div>
        <p *ngIf="codeEntered && !codeCorrect" class="text-red-400 font-light whitespace-break-spaces flexmt mx-1">Veuillez saisir un nom d'utilisateur valide.</p>
        <p *ngIf="codeEntered && codeCorrect" class="text-green-600 font-light whitespace-break-spaces flexmt mx-1">Nom d'utilisateur correct   Authentification réussie</p>
    </div>
    <div *ngIf="lvl==stringToNumber('2')" class="text-white">
        <p class="flex mx-1">
            5TC: \niveau_2 > C'est fini !
        </p>
    </div>



</div>
