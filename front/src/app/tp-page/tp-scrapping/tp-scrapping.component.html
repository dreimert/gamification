<div class="h-screen">
    <div class="bg-black h-4/5 w-4/5 rounded-lg absolute top-1/2 left-1/2  transform -translate-x-1/2 -translate-y-1/2 ">
        <div class="flex flex-row justify-center items-center bg-bgHeaderTable rounded-t-lg">
            <p class="flex w-full py-2 mx-3 ">TP Scrapping</p>
        </div>
        <div class="w-full h-5/6 overflow-auto mb-40">
            <div *ngIf="lvl === 0" class="text-white font-light mx-1">
                {{session?.name}} [{{date}}]<br>Durée {{duree}}h<br><br>
                <div *ngFor="let sentence of sentences; let i = index" class="animate-typing overflow-hidden whitespace-break-spaces flexmt -ml-1 text-white font-light my-2">
                    <ngx-typed-js *ngIf="i<=sentenceIndex" [typeSpeed]="1" [strings]="[sentence]" [showCursor]="false" (completed)="nextSentence()">
                        5TC:\Accueil> <span class="typing" ></span>
                    </ngx-typed-js>
                </div>
                <p *ngIf="sentenceIndex==sentences.length">Alicia:\Accueil> {{ passcode }}</p> 
                <p *ngIf="codeEntered && !codeCorrect" class="text-red-400 mx-1 font-medium">&emsp;&emsp;Veuillez taper 'start'.</p>
                <p *ngIf="codeEntered && codeCorrect" class="text-green-600 mx-1 font-medium">&emsp;&emsp;Très bien</p>
            </div>


            <div *ngIf="lvl === 1" >
                <div *ngFor="let sentence of sentences; let i = index" class="animate-typing overflow-hidden whitespace-break-spaces flexmt mx-1 text-white font-light">
                    <ngx-typed-js *ngIf="i<=sentenceIndex" [typeSpeed]="1" [strings]="[sentence]" [showCursor]="false" (completed)="nextSentence()">
                        <!-- i={{i}} length={{sentences.length}} -->
                        5TC:\Niveau_1 > <span class="typing" ></span>
                        <input *ngIf="i==sentences.length-1" class="relative bg-black border-none outline-none" type="text" [(ngModel)]="passcode"  (keyup.enter)="getEnteredPasscode(1)">
                    </ngx-typed-js>
                </div>
                <p *ngIf="codeEntered && !codeCorrect" class="text-red-400 font-medium whitespace-break-spaces flexmt mx-1">Veuillez saisir un nom d'utilisateur valide.</p>
                <p *ngIf="codeEntered && codeCorrect" class="text-green-600 font-medium whitespace-break-spaces flexmt mx-1">Nom d'utilisateur correct   Authentification réussie</p>
            </div>


            <div *ngIf="lvl === 2" class="text-white">
                <p class="flex mx-1">
                    5TC: \niveau_2 > C'est fini !
                </p>
            </div>
        </div>

        <div class="absolute flex w-full items-center justify-center bottom-3">
            <input class="rounded-lg w-1/2 outline-none ml-0 pl-2 font-light" type="text" [(ngModel)]="passcode" (keyup.enter)="getEnteredPasscode(lvl)" placeholder="Entrer votre code de passe ici">
        </div>
        <button class="w-14 h-8 absolute right-3 bottom-3 text-white bg-blue-600 rounded-lg" (click)="showHelpDialog()">help</button>

    </div>

    
</div>
